# VidSec — видеохостинг на микросервисах.
# Запуск: docker compose up -d --build
# Открыть: http://localhost:8080

name: vidsec

x-python-service: &python-service
  restart: unless-stopped
  env_file: .env

x-rabbitmq-node: &rabbitmq-node
  image: rabbitmq:3.13-management-alpine
  restart: unless-stopped
  environment:
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}   # общий секрет узлов кластера
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 5s
    retries: 10

services:
  # ---------- Собственные сервисы ----------
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"            # единственная точка входа для пользователя
    networks:
      edge: { ipv4_address: 10.77.1.10 }
      app:  { ipv4_address: 10.77.2.10 }
    depends_on:
      - api
      - auth-service

  auth-service:
    <<: *python-service
    build: ./auth-service
    volumes:
      - jwt-keys:/keys        # закрытый ключ подписи JWT, есть только у auth-service
    networks:
      app:        { ipv4_address: 10.77.2.20 }
      users-data: { ipv4_address: 10.77.3.20 }
    depends_on:
      users-db:
        condition: service_healthy

  api:
    <<: *python-service
    build: ./api
    networks:
      app:        { ipv4_address: 10.77.2.30 }
      video-data: { ipv4_address: 10.77.4.30 }
      cache:      { ipv4_address: 10.77.5.30 }
      broker:     { ipv4_address: 10.77.6.30 }
      storage:    { ipv4_address: 10.77.7.30 }
    depends_on:
      video-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      storage:
        condition: service_started
      auth-service:
        condition: service_started

  video-worker:
    <<: *python-service
    build: ./video-worker
    networks:
      video-data: { ipv4_address: 10.77.4.50 }
      broker:     { ipv4_address: 10.77.6.50 }
      storage:    { ipv4_address: 10.77.7.50 }
    depends_on:
      rabbitmq:
        condition: service_healthy
      video-db:
        condition: service_healthy
      storage:
        condition: service_started

  # ---------- Инфраструктура ----------
  users-db:                  # БД пользователей, доступна только auth-service
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${USERS_DB_NAME}
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
    volumes:
      - users-db-data:/var/lib/postgresql/data
      - ./db/users-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      users-data: { ipv4_address: 10.77.3.40 }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  video-db:                  # БД видео, каналов, оценок — PRIMARY (master)
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=5", "-c", "wal_keep_size=256MB",
              "-c", "hot_standby=on", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_DB: ${VIDEO_DB_NAME}
      POSTGRES_USER: ${VIDEO_DB_USER}
      POSTGRES_PASSWORD: ${VIDEO_DB_PASSWORD}
    volumes:
      - video-db-data:/var/lib/postgresql/data
      - ./db/video-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/replication/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      video-data: { ipv4_address: 10.77.4.40 }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  video-db-standby:          # БД видео — STANDBY: копия primary по потоковой репликации
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/standby-entrypoint.sh"]
    environment:
      PRIMARY_HOST: video-db
      REPL_USER: ${VIDEO_DB_USER}
      REPL_PASSWORD: ${VIDEO_DB_PASSWORD}
    volumes:
      - video-db-standby-data:/var/lib/postgresql/data
      - ./db/replication/standby-entrypoint.sh:/standby-entrypoint.sh:ro
      - ./db/replication/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      video-data: { ipv4_address: 10.77.4.41 }
    depends_on:
      video-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${REPL_USER}"]
      interval: 5s
      timeout: 3s
      retries: 30

  failover:                  # сторож: продвигает standby в master, если primary упал
    build: ./failover
    restart: unless-stopped
    env_file: .env
    networks:
      video-data: { ipv4_address: 10.77.4.60 }
    depends_on:
      video-db-standby:
        condition: service_started

  backup:                    # резервные копии обеих БД раз в час, хранятся 24 копии
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    command: ["sh", "/scripts/loop.sh"]
    volumes:
      - ./backup:/scripts:ro
      - ./backups:/backups    # копии видны в папке backups/ проекта
    networks:
      users-data: { ipv4_address: 10.77.3.70 }
      video-data: { ipv4_address: 10.77.4.70 }
    depends_on:
      video-db:
        condition: service_healthy
      users-db:
        condition: service_healthy

  redis:                     # кеш: просмотры, рекомендации
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      cache: { ipv4_address: 10.77.5.40 }
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  rabbitmq:                  # брокер сообщений, узел 1 из 3 (с веб-консолью)
    <<: *rabbitmq-node
    hostname: rabbitmq
    volumes:
      - rabbitmq-1-data:/var/lib/rabbitmq
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    ports:
      - "127.0.0.1:15672:15672"   # веб-консоль RabbitMQ, только с этого ноутбука
    networks:
      broker: { ipv4_address: 10.77.6.40 }
      admin:  { ipv4_address: 10.77.8.40 }   # только для веб-консоли

  rabbitmq-2:                # брокер, узел 2 из 3
    <<: *rabbitmq-node
    hostname: rabbitmq-2
    volumes:
      - rabbitmq-2-data:/var/lib/rabbitmq
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    networks:
      broker: { ipv4_address: 10.77.6.41 }

  rabbitmq-3:                # брокер, узел 3 из 3
    <<: *rabbitmq-node
    hostname: rabbitmq-3
    volumes:
      - rabbitmq-3-data:/var/lib/rabbitmq
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    networks:
      broker: { ipv4_address: 10.77.6.42 }

  storage:                   # S3-совместимое хранилище файлов (SeaweedFS)
    image: chrislusf/seaweedfs:4.45
    restart: unless-stopped
    # Конфиг S3 с ключом из .env создаётся при старте; анонимный доступ выключен.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        printf '{"identities":[{"name":"vidsec","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /etc/seaweedfs-s3.json &&
        exec /entrypoint.sh server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs-s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage-data:/data
    networks:
      storage: { ipv4_address: 10.77.7.40 }

  # ---------- Firewall ----------
  # Работает в сетевом пространстве хоста Docker (у Docker Desktop это его виртуальная машина)
  # и загружает правила iptables в цепочку DOCKER-USER. Правила: firewall/rules.conf.
  firewall:
    build: ./firewall
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./firewall/rules.conf:/etc/vidsec/rules.conf:ro

# ---------- Сегменты сети ----------
# internal: true — у сегмента нет выхода наружу (в интернет и на хост).
networks:
  edge:        # пользователь -> frontend (опубликован порт 8080)
    ipam: { config: [ { subnet: 10.77.1.0/24 } ] }
  app:         # frontend -> auth-service, api; api -> auth-service
    internal: true
    ipam: { config: [ { subnet: 10.77.2.0/24 } ] }
  users-data:  # auth-service -> users-db
    internal: true
    ipam: { config: [ { subnet: 10.77.3.0/24 } ] }
  video-data:  # api, video-worker -> video-db
    internal: true
    ipam: { config: [ { subnet: 10.77.4.0/24 } ] }
  cache:       # api -> redis
    internal: true
    ipam: { config: [ { subnet: 10.77.5.0/24 } ] }
  broker:      # api, video-worker -> rabbitmq
    internal: true
    ipam: { config: [ { subnet: 10.77.6.0/24 } ] }
  storage:     # api, video-worker -> S3
    internal: true
    ipam: { config: [ { subnet: 10.77.7.0/24 } ] }
  admin:       # администратор -> веб-консоль RabbitMQ (127.0.0.1:15672)
    ipam: { config: [ { subnet: 10.77.8.0/24 } ] }

volumes:
  users-db-data:
  video-db-data:
  storage-data:
  jwt-keys:
  video-db-standby-data:
  rabbitmq-1-data:
  rabbitmq-2-data:
  rabbitmq-3-data:
