# Белый список сетевых соединений VidSec.
# Всё, что здесь не перечислено, запрещено (DROP) и учитывается счётчиком.
# Ответные пакеты уже установленных соединений разрешены отдельным правилом (ESTABLISHED).
#
# Формат:  имя   источник     назначение    порт   описание
# "any" в источнике = любой адрес. Адреса и порты можно перечислять через запятую,
# диапазон портов пишется через двоеточие (35672:35682).

# --- edge: пользователь -> frontend
user-frontend      any          10.77.1.10    80     Пользователь открывает сайт (опубликованный порт 8080)
admin-rabbitmq     any          10.77.8.40    15672  Администратор открывает веб-консоль RabbitMQ

# --- app: прокси nginx и проверка JWT
frontend-auth      10.77.2.10   10.77.2.20    8000   nginx проксирует /auth/ в auth-service
frontend-api       10.77.2.10   10.77.2.30    8000   nginx проксирует /api/ в api
api-auth           10.77.2.30   10.77.2.20    8000   api получает открытый ключ JWT

# --- users-data: только auth-service видит БД пользователей
auth-usersdb       10.77.3.20   10.77.3.40    5432   auth-service -> PostgreSQL users-db

# --- video-data
api-videodb        10.77.4.30   10.77.4.40    5432   api -> PostgreSQL video-db
worker-videodb     10.77.4.50   10.77.4.40    5432   video-worker -> PostgreSQL video-db (статус видео)
api-standby        10.77.4.30   10.77.4.41    5432   api -> standby (станет master после переключения)
worker-standby     10.77.4.50   10.77.4.41    5432   video-worker -> standby (станет master после переключения)
pg-replication     10.77.4.41   10.77.4.40    5432   standby получает поток WAL от primary
failover-pg        10.77.4.60   10.77.4.40,10.77.4.41  5432   сторож проверяет оба узла и продвигает standby
backup-videodb     10.77.4.70   10.77.4.40,10.77.4.41  5432   резервное копирование video-db
backup-usersdb     10.77.3.70   10.77.3.40    5432   резервное копирование users-db

# --- cache
api-redis          10.77.5.30   10.77.5.40    6379   api -> Redis

# --- broker
api-rabbitmq       10.77.6.30   10.77.6.40,10.77.6.41,10.77.6.42  5672  api публикует задачи в кластер RabbitMQ (AMQP)
worker-rabbitmq    10.77.6.50   10.77.6.40,10.77.6.41,10.77.6.42  5672  video-worker забирает задачи из кластера (AMQP)
rabbit-cluster     10.77.6.40,10.77.6.41,10.77.6.42  10.77.6.40,10.77.6.41,10.77.6.42  4369,25672,35672:35682  связь узлов кластера RabbitMQ (epmd, Erlang)

# --- storage
api-storage        10.77.7.30   10.77.7.40    8333   api -> S3 (только S3-порт)
worker-storage     10.77.7.50   10.77.7.40    8333   video-worker -> S3 (только S3-порт)
