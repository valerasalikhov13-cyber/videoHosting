server {
    listen 80;
    server_name _;

    # Не сообщаем версию nginx в заголовках
    server_tokens off;

    # DNS Docker: адреса сервисов перечитываются каждые 10 с.
    # Без этого nginx запоминает IP при старте и после перезапуска api отвечает 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_upstream http://auth-service:8000;
    set $api_upstream  http://api:8000;

    # Заголовки безопасности: запрет встраивания во фреймы, MIME-sniffing и чужих скриптов
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # Статика фронтенда
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Сервис аутентификации
    location /auth/ {
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
    }

    # Основной API
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        client_max_body_size 200m;
        proxy_request_buffering off;   # загрузка видео идёт потоком
        proxy_buffering off;           # отдача видео идёт потоком
        proxy_read_timeout 300s;
    }
}
